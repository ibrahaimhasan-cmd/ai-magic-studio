<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Magic Studio</title><style>
body{margin:0;background:#090b18;color:#f5f5ff;font:16px system-ui;text-align:center}main{max-width:700px;margin:35px auto;padding:18px}.panel{background:#171a31;border:1px solid #ffffff28;border-radius:20px;padding:20px;text-align:left}h1{font-size:44px;background:linear-gradient(90deg,#fff,#b6a2ff,#61e8e5);background-clip:text;color:transparent}button,select,textarea{font:inherit;border-radius:12px;padding:12px;margin:6px 0}button{background:linear-gradient(90deg,#9b8bff,#59e5dc);border:0;font-weight:bold}textarea,select{width:100%;background:#0b1023;color:white;border:1px solid #394160}pre{white-space:pre-wrap;background:#0b1023;padding:15px;border-radius:12px;min-height:70px;color:#e9edff}.note{color:#aab2d0;font-size:13px}</style><main><h1>AI Magic Studio ✨</h1><p>Apne ideas ko AI captions aur image prompts mein badlo.</p><div class="panel"><label>Tool chunein</label><select id="kind"><option value="caption">AI Caption</option><option value="image">Image Prompt</option></select><label>Apna idea likhein</label><textarea id="idea" rows="4" placeholder="Jaise: doston ke saath trip"></textarea><button id="go">✨ Create Magic</button><button id="copy">📋 Copy</button><pre id="out">Yahan result aayega.</pre><p class="note">Image Prompt likha hua prompt banata hai, actual image nahi. API key server par secret rakhi jaati hai.</p></div></main><script>
const $=id=>document.getElementById(id);$('go').onclick=async()=>{let idea=$('idea').value.trim()||'a creative idea',kind=$('kind').value;let prompt=kind==='caption'?`Write 3 catchy original Hindi/Hinglish social media captions about: ${idea}.`:`Write one detailed image generation prompt for: ${idea}. Include composition, lighting, and style.`;$('go').disabled=true;$('out').textContent='AI soch raha hai…';try{let r=await fetch('/.netlify/functions/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');$('out').textContent=d.text||'No result';}catch(e){$('out').textContent='Connection error: '+e.message+'\nCheck Netlify environment variable GEMINI_API_KEY.'}finally{$('go').disabled=false}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').textContent)}catch(e){}};</script></html>
